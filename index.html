<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d64">
  <title>Annuaire des structures Odynéo</title>
  <link rel="stylesheet" href="./style.css">
  <script>
    (function () {
      let origin = 'https://docs.getgrist.com';
      try { if (document.referrer) origin = new URL(document.referrer).origin; } catch (_) {}
      document.write('<script src="' + origin + '/grist-plugin-api.js"><\/script>');
    })();
  </script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div id="brand" class="brand" aria-label="Logo de l’association">O</div>
      <div class="heading">
        <p class="eyebrow">ANNUAIRE DES STRUCTURES</p>
        <h1 id="page-title">Carte d’identité des établissements</h1>
        <p id="page-subtitle">Un établissement, puis ses SAJ, foyers, services et unités.</p>
      </div>
      <span id="connection" class="connection">Connexion à Grist…</span>
    </header>
    <div id="message" class="message hidden" role="status" aria-live="polite"></div>
    <section id="main-panel" class="main-panel" aria-live="polite"></section>
    <footer class="footer">Les fiches sont enregistrées dans les tables Grist. Les images sont facultatives. <span class="build-label">Annuaire Odynéo · 3 tables Grist</span></footer>
  </main>
  <script src="./script.js" defer></script>
</body>
</html>
