<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d64">
  <title>Carte d’identité de la structure</title>
  <link rel="stylesheet" href="./style.css">
  <script>
    (function () {
      let origin = 'https://docs.getgrist.com';
      try { if (document.referrer) origin = new URL(document.referrer).origin; } catch (_) {}
      document.write('<script src="' + origin + '/grist-plugin-api.js"><\/script>');
    })();
  </script>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <a class="brand" id="brand" href="#" aria-label="Accueil">O</a>
      <div class="heading"><h1 id="page-title">Carte d’identité de la structure</h1><p id="page-subtitle">Les informations se saisissent une fois. Les lieux et les unités sont ensuite rattachés à l’établissement.</p></div>
      <span id="connection" class="connection">Connexion à Grist…</span>
    </header>
    <div id="message" class="message hidden" role="status" aria-live="polite"></div>
    <section id="main-panel" class="main-panel" aria-live="polite"></section>
  </main>
  <dialog id="edit-dialog" class="edit-dialog"></dialog>
  <script src="./script.js" defer></script>
</body>
</html>
